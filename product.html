<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزئیات محصول | تی‌شرت استور</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <i class="fas fa-tshirt"></i>
                    <span>تی‌شرت استور</span>
                </a>
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="index.html">خانه</a></li>
                    <li><a href="products.html">محصولات</a></li>
                    <li><a href="about.html">درباره ما</a></li>
                    <li><a href="contact.html">تماس با ما</a></li>
                        <li><a href="admin.html" style="color:#f59e0b;">پنل مدیریت</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <button class="cart-btn" id="cartBtn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </button>
                <button class="menu-toggle" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <section class="product-detail">
        <div class="container">
            <div class="product-detail-grid" id="productDetail">
                <!-- Loaded by JS -->
            </div>
        </div>
    </section>

    <section class="related-products">
        <div class="container">
            <h2>محصولات مرتبط</h2>
            <div class="products-grid" id="relatedProducts"></div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>© ۱۴۰۳ تی‌شرت استور. تمامی حقوق محفوظ است.</p>
            </div>
        </div>
    </footer>

    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>سبد خرید</h3>
            <button class="close-cart" id="closeCart"><i class="fas fa-times"></i></button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>جمع کل:</span>
                <span id="cartTotal">۰ تومان</span>
            </div>
            <button class="btn btn-primary btn-block" id="checkoutBtn">ادامه خرید</button>
        </div>
    </div>
    <div class="overlay" id="overlay"></div>

    <script src="js/api.js"></script>
    <script src="js/products-data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/product-detail.js"></script>
</body>
</html>
